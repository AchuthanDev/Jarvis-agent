<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS — Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <h1 class="brand">JARVIS</h1>
      <button id="new-conversation" class="new-chat" type="button">+ New conversation</button>
      <nav id="conversation-list" class="conversation-list" aria-label="Conversations"></nav>
    </aside>

    <main class="chat">
      <header class="chat-header">
        <div class="status">
          <span id="status-dot" class="status-dot" aria-hidden="true"></span>
          <span id="status-text">Connecting…</span>
        </div>
        <div class="view-switcher">
          <button id="chat-view-button" class="view-button active" type="button">Chat</button>
          <button id="devices-view-button" class="view-button" type="button">Devices</button>
        </div>
      </header>

      <section id="messages" class="messages" aria-live="polite"></section>

      <section id="devices-view" class="devices-view hidden">
        <div class="section-header">
          <h2>Devices</h2>
          <button id="refresh-devices" type="button">Refresh</button>
        </div>
        <div id="devices-list" class="devices-list"></div>
      </section>

      <form id="chat-form" class="composer">
        <textarea
          id="message-input"
          rows="1"
          placeholder="Message JARVIS…"
          autocomplete="off"
        ></textarea>
        <button id="send-button" type="submit" disabled>Send</button>
      </form>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
